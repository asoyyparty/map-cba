<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Fiber Optic Neon Gradients -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="blueLine" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="65%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>

    <radialGradient id="ambientCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Ambient Center Glow Backdrop -->
  <circle cx="256" cy="256" r="190" fill="url(#ambientCyan)"/>

  <!-- Radar Rings / Orbital Grid -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="125" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>
  <circle cx="256" cy="256" r="65" fill="none" stroke="#0284C7" stroke-width="1.5" opacity="0.35"/>

  <!-- Geometric Fiber Grid Underlay (Hexagonal Shield) -->
  <polygon points="256,96 394,176 394,336 256,416 118,336 118,176" 
           fill="none" stroke="#1E293B" stroke-width="1.5" opacity="0.5"/>

  <!-- Inner Hexagon Ring -->
  <polygon points="256,131 364,193.5 364,318.5 256,381 148,318.5 148,193.5" 
           fill="none" stroke="url(#cyanLine)" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Cross-Mesh Fiber Connections -->
  <g stroke="url(#blueLine)" stroke-width="2.5" opacity="0.85" filter="url(#neonGlow)">
    <!-- Radial spokes from center to 6 outer nodes -->
    <line x1="256" y1="256" x2="256" y2="131"/>
    <line x1="256" y1="256" x2="364" y2="193.5"/>
    <line x1="256" y1="256" x2="364" y2="318.5"/>
    <line x1="256" y1="256" x2="256" y2="381"/>
    <line x1="256" y1="256" x2="148" y2="318.5"/>
    <line x1="256" y1="256" x2="148" y2="193.5"/>

    <!-- Cross triangulation mesh -->
    <line x1="256" y1="131" x2="364" y2="318.5" stroke-dasharray="3 4" opacity="0.4"/>
    <line x1="256" y1="131" x2="148" y2="318.5" stroke-dasharray="3 4" opacity="0.4"/>
    <line x1="148" y1="193.5" x2="364" y2="193.5" stroke-dasharray="4 4" opacity="0.3"/>
    <line x1="148" y1="318.5" x2="364" y2="318.5" stroke-dasharray="4 4" opacity="0.3"/>
  </g>

  <!-- Outer Satellite Sub-Nodes (Branching Infrastructure) -->
  <!-- Top Branch -->
  <line x1="256" y1="131" x2="256" y2="80" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
  <circle cx="256" cy="80" r="5" fill="#38BDF8" filter="url(#neonGlow)"/>

  <!-- Top-Right Branch -->
  <line x1="364" y1="193.5" x2="416" y2="163.5" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
  <circle cx="416" cy="163.5" r="5" fill="#38BDF8" filter="url(#neonGlow)"/>

  <!-- Bottom-Right Branch -->
  <line x1="364" y1="318.5" x2="416" y2="348.5" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
  <circle cx="416" cy="348.5" r="5" fill="#38BDF8" filter="url(#neonGlow)"/>

  <!-- Bottom Branch -->
  <line x1="256" y1="381" x2="256" y2="432" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
  <circle cx="256" cy="432" r="5" fill="#38BDF8" filter="url(#neonGlow)"/>

  <!-- Bottom-Left Branch -->
  <line x1="148" y1="318.5" x2="96" y2="348.5" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
  <circle cx="96" cy="348.5" r="5" fill="#38BDF8" filter="url(#neonGlow)"/>

  <!-- Top-Left Branch -->
  <line x1="148" y1="193.5" x2="96" y2="163.5" stroke="#38BDF8" stroke-width="2" stroke-dasharray="2 3"/>
  <circle cx="96" cy="163.5" r="5" fill="#38BDF8" filter="url(#neonGlow)"/>

  <!-- Intermediate Telemetry Packets (Energy Pulses on Lines) -->
  <circle cx="256" cy="180" r="3.5" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="320" cy="218" r="3.5" fill="#00F2FE" filter="url(#neonGlow)"/>
  <circle cx="320" cy="294" r="3.5" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="256" cy="332" r="3.5" fill="#00F2FE" filter="url(#neonGlow)"/>
  <circle cx="192" cy="294" r="3.5" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="192" cy="218" r="3.5" fill="#00F2FE" filter="url(#neonGlow)"/>

  <!-- 6 Main Primary Network Nodes -->
  <!-- Top Node -->
  <circle cx="256" cy="131" r="14" fill="#0B132B" stroke="#00F2FE" stroke-width="3.5"/>
  <circle cx="256" cy="131" r="7" fill="url(#nodeGlow)" filter="url(#neonGlow)"/>

  <!-- Top Right Node -->
  <circle cx="364" cy="193.5" r="14" fill="#0B132B" stroke="#38BDF8" stroke-width="3.5"/>
  <circle cx="364" cy="193.5" r="7" fill="url(#nodeGlow)" filter="url(#neonGlow)"/>

  <!-- Bottom Right Node -->
  <circle cx="364" cy="318.5" r="14" fill="#0B132B" stroke="#60A5FA" stroke-width="3.5"/>
  <circle cx="364" cy="318.5" r="7" fill="url(#nodeGlow)" filter="url(#neonGlow)"/>

  <!-- Bottom Node -->
  <circle cx="256" cy="381" r="14" fill="#0B132B" stroke="#00F2FE" stroke-width="3.5"/>
  <circle cx="256" cy="381" r="7" fill="url(#nodeGlow)" filter="url(#neonGlow)"/>

  <!-- Bottom Left Node -->
  <circle cx="148" cy="318.5" r="14" fill="#0B132B" stroke="#60A5FA" stroke-width="3.5"/>
  <circle cx="148" cy="318.5" r="7" fill="url(#nodeGlow)" filter="url(#neonGlow)"/>

  <!-- Top Left Node -->
  <circle cx="148" cy="193.5" r="14" fill="#0B132B" stroke="#38BDF8" stroke-width="3.5"/>
  <circle cx="148" cy="193.5" r="7" fill="url(#nodeGlow)" filter="url(#neonGlow)"/>

  <!-- Central Nexus Core (The Heart of the Network) -->
  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="36" fill="none" stroke="#00F2FE" stroke-width="2" opacity="0.6" stroke-dasharray="5 3"/>
  <circle cx="256" cy="256" r="30" fill="#071228" stroke="#38BDF8" stroke-width="3"/>
  <!-- Glowing Center Energy Sphere -->
  <circle cx="256" cy="256" r="20" fill="url(#coreGlow)" filter="url(#intenseGlow)"/>
  <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>
</svg>
